<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160">
  <rect width="100%" height="100%" rx="12" fill="#021322"/>
  <g fill="#7dd3fc" font-family="sans-serif" font-size="14">
    <text x="20" y="36">Synchronous (blocking):</text>
    <text x="36" y="62" font-size="12" fill="#9aa7b2">• Executes step-by-step, waits for each operation to finish.</text>
    <text x="20" y="96">Asynchronous (non-blocking):</text>
    <text x="36" y="122" font-size="12" fill="#9aa7b2">• Starts operations and continues; callbacks/promises handle results.</text>
  </g>
</svg>