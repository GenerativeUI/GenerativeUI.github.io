<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360">
  <rect width="100%" height="100%" fill="#041826" rx="12"/>
  <g transform="translate(40,40)" fill="#7dd3fc" font-family="sans-serif">
    <text x="0" y="0" font-size="20">LPDDR vs DDR — at a glance</text>
    <text x="0" y="36" fill="#9fb0bf" font-size="13">• LPDDR: low-power, soldered, optimized for battery life.</text>
    <text x="0" y="60" fill="#9fb0bf" font-size="13">• DDR: module-based, higher peak throughput, upgradeable.</text>
    <rect x="0" y="90" width="220" height="120" rx="10" fill="#072340"/>
    <text x="110" y="150" fill="#ffd166" font-size="14" text-anchor="middle">Phone (LPDDR)</text>
    <rect x="300" y="90" width="220" height="120" rx="10" fill="#072340"/>
    <text x="410" y="150" fill="#ffd166" font-size="14" text-anchor="middle">Laptop (DDR)</text>
  </g>
</svg>