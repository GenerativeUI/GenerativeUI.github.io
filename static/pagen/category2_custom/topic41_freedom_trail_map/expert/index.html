 military training ground and public gathering space throughout colonial history.",year:"1634",image:"https://images.unsplash.com/photo-1726347921598-8da9d212030e?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"139 Tremont Street, Boston, MA",facts:["Used as a cow pasture until 1830","Site of public hangings and executions until 1817","First public park in the United States"]},{number:2,name:"Massachusetts State House",description:"Completed in 1798, this iconic golden-domed building serves as the state capitol. The dome was originally made of wood and later covered in copper by Paul Revere's company.",year:"1798",image:"https://images.unsplash.com/photo-1670464452366-28dbfdecfdf7?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"Beacon Street, Boston, MA",facts:["The dome is covered in 23-karat gold leaf","Designed by architect Charles Bulfinch","Contains the Sacred Cod, a wooden fish symbolizing fishing industry"]},{number:3,name:"Park Street Church",description:"Built in 1809, this church has been a center of religious and social activism. William Lloyd Garrison delivered his first anti-slavery speech here in 1829.",year:"1809",image:"https://images.unsplash.com/photo-1632748750121-44a41698ca8a?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"1 Park Street, Boston, MA",facts:["The steeple is 217 feet tall","Gunpowder was stored here during War of 1812",`"America (My Country, 'Tis of Thee)" was first sung here in 1831`]},{number:4,name:"Granary Burying Ground",description:"Founded in 1660, this cemetery is the final resting place of Paul Revere, Samuel Adams, John Hancock, and the victims of the Boston Massacre.",year:"1660",image:"https://images.unsplash.com/photo-1726347921598-8da9d212030e?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"Tremont Street, Boston, MA",facts:["Contains over 2,300 grave markers","Named after the grain storage building that once stood nearby","Five victims of Boston Massacre buried here"]},{number:5,name:"King's Chapel & Burying Ground",description:"The burying ground dates to 1630, making it Boston's oldest cemetery. The stone chapel was built in 1754 and served as the first Anglican church in New England.",year:"1754",image:"https://images.unsplash.com/photo-1632748750121-44a41698ca8a?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"58 Tremont Street, Boston, MA",facts:["Built around the original wooden church","Contains the oldest headstone in Boston (1658)","Bell cast by Paul Revere"]},{number:6,name:"Boston Latin School Site & Benjamin Franklin Statue",description:"Site of the first public school in America, founded in 1635. The statue honors Benjamin Franklin, one of its most famous students.",year:"1635",image:"https://images.unsplash.com/photo-1632748750121-44a41698ca8a?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"School Street, Boston, MA",facts:["Oldest public school in America","Five signers of Declaration attended here","Franklin statue created in 1856"]},{number:7,name:"Old Corner Bookstore",description:"Built in 1718, this building became a literary landmark in the 19th century as the publishing house of Ticknor and Fields, publishers of American literary giants.",year:"1718",image:"https://images.unsplash.com/photo-1632748750121-44a41698ca8a?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"283 Washington Street, Boston, MA",facts:["Published works by Emerson, Thoreau, and Longfellow","Survived the Great Fire of 1872","One of oldest brick buildings in Boston"]},{number:8,name:"Old South Meeting House",description:"Built in 1729, this Puritan church was the starting point of the Boston Tea Party in 1773. It served as a gathering place for colonial protests.",year:"1729",image:"https://images.unsplash.com/photo-1726347921598-8da9d212030e?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"310 Washington Street, Boston, MA",facts:["Site where Boston Tea Party was organized","Held up to 5,000 people during colonial meetings","Used as riding school by British during occupation"]},{number:9,name:"Old State House",description:"Built in 1713, this is Boston's oldest surviving public building. The Boston Massacre occurred on its doorstep in 1770, and the Declaration of Independence was first read to Bostonians from its balcony.",year:"1713",image:"https://images.unsplash.com/photo-1670464452366-28dbfdecfdf7?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"206 Washington Street, Boston, MA",facts:["Served as colonial government headquarters","Lion and unicorn on roof symbolized British rule","Now a museum of Boston history"]},{number:10,name:"Boston Massacre Site",description:"On March 5, 1770, British soldiers fired into a crowd of colonists, killing five men. This event galvanized colonial opposition to British rule.",year:"1770",image:"https://images.unsplash.com/photo-1670464452366-28dbfdecfdf7?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"State Street & Congress Street, Boston, MA",facts:["First bloodshed of the American Revolution","Crispus Attucks was first to die","Event immortalized by Paul Revere's engraving"]},{number:11,name:"Faneuil Hall",description:"Built in 1742, this marketplace and meeting hall was a center of revolutionary activity. Samuel Adams and other patriots gave rousing speeches here.",year:"1742",image:"https://images.unsplash.com/photo-1654487400983-153fa92b1d5a?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"1 Faneuil Hall Square, Boston, MA",facts:['Known as "Cradle of Liberty"',"Grasshopper weathervane on top since 1742","Expanded by Charles Bulfinch in 1806"]},{number:12,name:"Paul Revere House",description:"Built around 1680, this is downtown Boston's oldest building. Paul Revere lived here when he made his famous midnight ride in 1775.",year:"1680",image:"https://images.unsplash.com/photo-1737587539149-b47e78dba152?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"19 North Square, Boston, MA",facts:["Oldest house in downtown Boston","Revere raised 16 children here","Restored to colonial appearance in 1908"]},{number:13,name:"Old North Church",description:"Built in 1723, this is Boston's oldest standing church. Two lanterns hung in its steeple signaled Paul Revere that British troops were coming by sea in 1775.",year:"1723",image:"https://images.unsplash.com/photo-1657310270177-11ef6a7a3cdf?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"193 Salem Street, Boston, MA",facts:[`Inspired Longfellow's poem "Paul Revere's Ride"`,"Bells cast in England in 1744","Still an active Episcopal church"]},{number:14,name:"Copp's Hill Burying Ground",description:"Established in 1659, this cemetery contains the graves of thousands of colonial Bostonians, including many free African Americans.",year:"1659",image:"https://images.unsplash.com/photo-1726347921598-8da9d212030e?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"Hull Street, Boston, MA",facts:["British used it to aim cannons during Battle of Bunker Hill","Contains over 10,000 burials","Second oldest cemetery in Boston"]},{number:15,name:"USS Constitution",description:`Launched in 1797, this is the world's oldest commissioned naval vessel still afloat. "Old Ironsides" earned her nickname during the War of 1812.`,year:"1797",image:"https://images.unsplash.com/photo-1726401123000-2663cd2134b7?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"Charlestown Navy Yard, Boston, MA",facts:["Never lost a battle in naval combat","Hull is made of oak, not iron","Still sails once per year"]},{number:16,name:"Bunker Hill Monument",description:"This 221-foot granite obelisk commemorates the Battle of Bunker Hill on June 17, 1775, one of the first major battles of the American Revolution.",year:"1843",image:"https://images.unsplash.com/photo-1647748541360-64e2bdb40ace?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080",address:"Monument Square, Charlestown, MA",facts:["294 steps to the top","Battle actually fought on Breed's Hill","Britis
