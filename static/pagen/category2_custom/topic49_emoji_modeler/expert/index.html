    // Export Canvas Utility
    async function exportCanvas(
      baseImage,
      elements,
      background,
      adjustments,
      size,
      format
    ) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      if (!ctx) {
        throw new Error('Could not get canvas context');
      }

      // Draw background
      if (background.type === 'solid' && background.color) {
        ctx.fillStyle = background.color;
        ctx.fillRect(0, 0, size, size);
      } else if (background.type === 'gradient' && background.gradient) {
        const gradient = ctx.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, background.gradient.from);
        gradient.addColorStop(1, background.gradient.to);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);
      }

      // Draw base image if exists
      if (baseImage) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = baseImage;
        });

        // Apply filters
        ctx.filter = `brightness(${100 + adjustments.brightness}%) contrast(${100 + adjustments.contrast}%) saturate(${100 + adjustments.saturation}%) blur(${adjustments.blur}px)`;
        ctx.drawImage(img, 0, 0, size, size);
        ctx.filter = 'none';
      }

      // Draw elements in order
      const sortedElements = [...elements].sort((a, b) => a.zIndex - b.zIndex);
      
      for (const element of sortedElements) {
        ctx.save();

        const scale = size / 512;
        const x = element.x * scale;
        const y = element.y * scale;
        const width = element.width * scale;
        const height = element.height * scale;

        ctx.translate(x + width / 2, y + height / 2);
        ctx.rotate((element.rotation * Math.PI) / 180);
        ctx.scale(element.flipX ? -1 : 1, element.flipY ? -1 : 1);
        ctx.globalAlpha = element.opacity;

        if (element.color) {
          ctx.fillStyle = element.color;
        }

        if (element.type === 'text' && element.fontSize) {
          const fontSize = element.fontSize * scale;
          ctx.font = `${fontSize}px Arial, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(element.content || '', 0, 0);
        } else if (element.type === 'shape') {
          const fontSize = width;
          ctx.font = `${fontSize}px Arial, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(element.content || '', 0, 0);
        } else {
          const fontSize = width * 0.8;
          ctx.font = `${fontSize}px Arial, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(element.content || '', 0, 0);
        }

        ctx.restore();
      }

      const mimeType = format === 'png' ? 'image/png' : format === 'jpg' ? 'image/jpeg' : 'image/webp';
      return canvas.toDataURL(mimeType, 0.95);
    }

    // UploadArea Component
    function UploadArea({ onImageUpload }) {
      const [isDragging, setIsDragging] = useState(false);

      const handleDrop = useCallback((e) => {
        e.preventDefault();
        setIsDragging(false);
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (event) => {
            if (event.target?.result) {
              onImageUpload(event.target.result);
            }
          };
          reader.readAsDataURL(file);
        }
      }, [onImageUpload]);

      const handleDragOver = useCallback((e) => {
        e.preventDefault();
        setIsDragging(true);
      }, []);

      const handleDragLeave = useCallback(() => {
        setIsDragging(false);
      }, []);

      const handleFileInput = useCallback((e) => {
        const file = e.target.files?.[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            if (event.target?.result) {
              onImageUpload(event.target.result);
            }
          };
          reader.readAsDataURL(file);
        }

    // Canvas Component
    function Canvas({
      baseImage,
      elements,
      background,
      adjustments,
      zoom,
      onZoomChange,
      selectedElementId,
      onSelectElement,
      onUpdateElement,
      onDragEnd,
    }) {
      const canvasRef = useRef(null);
      const [isDragging, setIsDragging] = useState(false);
      const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
      const [hoveredElementId, setHoveredElementId] = useState(null);
      const [dragStartState, setDragStartState] = useState(null);

      const getBackgroundStyle = () => {
        if (background.type === 'transparent') {
          return {
            backgroundImage: 'linear-gradient(45deg, #f3f4f6 25%, transparent 25%, transparent 75%, #f3f4f6 75%, #f3f4f6), linear-gradient(45deg, #f3f4f6 25%, transparent 25%, transparent 75%, #f3f4f6 75%, #f3f4f6)',
            backgroundSize: '20px 20px',
            backgroundPosition: '0 0, 10px 10px',
          };
        }
        if (background.type === 'solid') {
          return { backgroundColor: background.color };
        }
        if (background.type === 'gradient' && background.gradient) {
          return {
            backgroundImage: `linear-gradient(${background.gradient.direction}deg, ${background.gradient.from}, ${background.gradient.to})`,
          };
        }
        return {};
      };

      const getImageFilter = () => {
        return `brightness(${100 + adjustments.brightness}%) contrast(${100 + adjustments.contrast}%) saturate(${100 + adjustments.saturation}%) blur(${adjustments.blur}px)`;
      };

      const handleMouseDown = (e, elementId) => {
        e.stopPropagation();
        onSelectElement(elementId);
        setIsDragging(true);
        
        const element = elements.find((el) => el.id === elementId);
        const canvasRect = canvasRef.current?.getBoundingClientRect();
        
        if (element && canvasRect) {
          // Store the initial state for undo/redo
          setDragStartState({ x: element.x, y: element.y });
          
          // Store offset in canvas coordinates (not screen coordinates)
          const mouseCanvasX = (e.clientX - canvasRect.left) / zoom;
          const mouseCanvasY = (e.clientY - canvasRect.top) / zoom;
          
          setDragOffset({
            x: mouseCanvasX - element.x,
            y: mouseCanvasY - element.y
          });
        }
      };

      const handleMouseMove = (e) => {
        if (isDragging && selectedElementId) {
          const canvasRect = canvasRef.current?.getBoundingClientRect();
          if (canvasRect) {
            // Convert mouse position to canvas coordinates
            const mouseCanvasX = (e.clientX - canvasRect.left) / zoom;
            const mouseCanvasY = (e.clientY - canvasRect.top) / zoom;
            
            // Calculate new element position
            const newX = mouseCanvasX - dragOffset.x;
            const newY = mouseCanvasY - dragOffset.y;
            
            onUpdateElement(selectedElementId, { x: newX, y: newY });
          }
        }
      };

      const handleMouseUp = () => {
        if (isDragging && dragStartState && onDragEnd) {
          // Save to history when drag ends
          onDragEnd();
        }
        setIsDragging(false);
        setDragStartState(null);
      };

      return (
        <div className="flex-1 flex flex-col bg-gradient-to-br from-gray-50 via-purple-50/30 to-blue-50/30 pb-16 lg:pb-0">
          <div className="p-2 md:p-4 flex items-center justify-center">
            <div className="flex items-center gap-1 md:gap-2 px-2 md:px-4 py-1.5 md:py-2 bg-white rounded-xl shadow-sm border border-gray-200">
              <button
                onClick={() => onZoomChange(Math.max(0.25, zoom - 0.25))}
                disabled={zoom <= 0.25}
                className="p-1.5 md:p-2 hover:bg-purple-50 rounded-lg transition-all disabled:opacity-40 disabled:cursor-not-allowed touch-manipulation"
              >
                <ZoomOut className="w-4 h-4" />
              </button>
              <span className="px-2 md:px-4 text-xs md:text-sm font-medium min-w-[50px] md:min-w-[60px] text-center">
                {Math.round(zoom * 100)}%
              </span>
              <button
                onClick={() => onZoomChange(Math.min(3, zoom + 0.25))}
                disabled={zoom >= 3}
                className="p-1.5 md:p-2 hover:bg-purple-50 rounded-lg transition-all disabled:opacity-40 disabled:cursor-not-allowed touch-manipulation"
              >
                <ZoomIn className="w-4 h-4" />
              </button>
              <div className="w-px h-4 md:h-6 bg-gray-300 mx-0.5 md:mx-1" />
              <button
                onClick={() => onZoomChange(1)}
                className="p-1.5 md:p-2 hover:bg-purple-50 rounded-lg transition-all touch-manipulation"
                title="Reset zoom"
              >
                <Maximize2 className="w-4 h-4" />
              </button>
            </div>
          </div>

          <div
            className="flex-1 overflow-auto flex items-center justify-center p-2 md:p-4 lg:p-8"
            onClick={() => onSelectElement(null)}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
            onTouchMove={handleMouseMove}
            onTouchEnd={handleMouseUp}
          >
            <div
              ref={canvasRef}
              id="emoji-canvas"
              className="relative shadow-xl md:shadow-2xl rounded-xl md:rounded-2xl overflow-hidden"
              style={{
                width: Math.min(window.innerWidth - 32, 512 * zoom),
                height: Math.min(window.innerWidth - 32, 512 * zoom),
                maxWidth: 512 * zoom,
                maxHeight: 512 * zoom,
                ...getBackgroundStyle(),
              }}
            >
              {baseImage && (
                <img
                  src={baseImage}
                  alt="Base"
                  className="absolute inset-0 w-full h-full object-cover pointer-events-none"
                  style={{ filter: getImageFilter() }}
                  crossOrigin="anonymous"
                />
              )}

              {elements
                .sort((a, b) => a.zIndex - b.zIndex)
                .map((element) => {
                  const isSelected = selectedElementId === element.id;
                  const isHovered = hoveredElementId === element.id;
                  
                  return (
                    <div
                      key={element.id}
                      className={`absolute select-none transition-all ${
                        isSelected ? 'z-50 cursor-move' : 'cursor-pointer'
                      } ${isHovered && !isSelected ? 'scale-105' : ''}`}
                      style={{
                        left: element.x * zoom,
                        top: element.y * zoom,
                        width: element.width * zoom,
                        height: element.height * zoom,
                        transform: `rotate(${element.rotation}deg) scaleX(${element.flipX ? -1 : 1}) scaleY(${element.flipY ? -1 : 1})`,
                        opacity: element.opacity,
                        color: element.color,
                        fontSize: (element.fontSize || 48) * zoom,
                      }}
                      onClick={(e) => {
                        e.stopPropagation();
                        onSelectElement(element.id);
                      }}
                      onMouseDown={(e) => handleMouseDown(e, element.id)}
                      onMouseEnter={() => setHoveredElementId(element.id)}
                      onMouseLeave={() => setHoveredElementId(null)}
                    >
                      {(isSelected || isHovered) && (
                        <div
                          className={`absolute inset-0 rounded-lg border-2 pointer-events-none ${
                            isSelected
                              ? 'border-purple-500 shadow-lg shadow-purple-500/50'
                              : 'border-purple-300'
                          }`}
                          style={{ transform: 'scale(1.1)' }}
                        >
                          {isSelected && (
                            <>
                              <div className="absolute -top-1.5 -left-1.5 w-3 h-3 bg-purple-500 rounded-full" />
                              <div className="absolute -top-1.5 -right-1.5 w-3 h-3 bg-purple-500 rounded-full" />
                              <div className="absolute -bottom-1.5 -left-1.5 w-3 h-3 bg-purple-500 rounded-full" />
                              <div className="absolute -bottom-1.5 -right-1.5 w-3 h-3 bg-purple-500 rounded-full" />
                              
                              <div className="absolute -top-8 left-1/2 -translate-x-1/2 px-2 py-1 bg-purple-500 text-white rounded text-xs flex items-center gap-1 whitespace-nowrap">
                                <Grip className="w-3 h-3" />
                                Drag to move
                              </div>
                            </>
                          )}
                        </div>
                      )}

                      <div className="w-full h-full flex items-center justify-center pointer-events-none">
                        {element.type === 'text' ? (
                          <div style={{ fontSize: (element.fontSize || 48) * zoom }}>
                            {element.content}
                          </div>
                        ) : element.type === 'shape' ? (
                          <div
                            style={{
                              color: element.color,
                              fontSize: element.width * zoom,
                              lineHeight: '1',
                            }}
                          >
                            {element.content}
                          </div>
                        ) : (
                          <div style={{ fontSize: element.width * zoom * 0.8, lineHeight: '1' }}>
                            {element.content}
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
            </div>
          </div>

          <div className="p-4 flex items-center justify-center">
            <div className="px-4 py-2 bg-white rounded-xl shadow-sm border border-gray-200 text-sm text-gray-600">
              Canvas: 512 × 512px • {elements.length} element{elements.length !== 1 ? 's' : ''}
            </div>
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      const initialState = {
        baseImage: null,
        elements: [],
        background: { type: 'transparent' },
        adjustments: {
          brightness: 0,
          contrast: 0,
          saturation: 0,
          blur: 0,
        },
        projectName: 'Emojify',
        zoom: 1,
      };

      const [state, setState] = useState(initialState);
      const [history, setHistory] = useState([initialState]);
      const [historyIndex, setHistoryIndex] = useState(0);
      const [selectedElementId, setSelectedElementId] = useState(null);
      const [mobileLeftPanel, setMobileLeftPanel] = useState(false);
      const [mobileRightPanel, setMobileRightPanel] = useState(false);

      const saveHistory = useCallback((newState) => {
        setHistory((prev) => [...prev.slice(0, historyIndex + 1), newState]);
        setHistoryIndex((prev) => prev + 1);
        setState(newState);
      }, [historyIndex]);

      const handleUndo = () => {
        if (historyIndex > 0) {
          setHistoryIndex(historyIndex - 1);
          setState(history[historyIndex - 1]);
        }
      };

      const handleRedo = () => {
        if (historyIndex < history.length - 1) {
          setHistoryIndex(historyIndex + 1);
          setState(history[historyIndex + 1]);
        }
      };

      const handleReset = () => {
        const resetState = {
          ...initialState,
          baseImage: state.baseImage,
          projectName: state.projectName,
        };
        saveHistory(resetState);
        setSelectedElementId(null);
      };

      const handleImageUpload = (imageUrl) => {
        saveHistory({ ...state, baseImage: imageUrl });
      };

      const handleAddElement = (element) => {
        const newElement = {
          ...element,
          id: `element-${Date.now()}-${Math.random()}`,
          x: 206,
          y: 206,
          zIndex: state.elements.length,
        };
        saveHistory({
          ...state,
          elements: [...state.elements, newElement],
        });
        setSelectedElementId(newElement.id);
      };

      // Direct update without history for smooth dragging
      const handleUpdateElementDirect = (id, updates) => {
        setState((prevState) => {
          const newElements = prevState.elements.map((el) =>
            el.id === id ? { ...el, ...updates } : el
          );
          return { ...prevState, elements: newElements };
        });
      };

      // Update with history for slider changes
      const handleUpdateElement = (id, updates) => {
        setState((prevState) => {
          const newElements = prevState.elements.map((el) =>
            el.id === id ? { ...el, ...updates } : el
          );
          const newState = { ...prevState, elements: newElements };
          
          // Update history
          setHistory((prev) => [...prev.slice(0, historyIndex + 1), newState]);
          setHistoryIndex((prev) => prev + 1);
          
          return newState;
        });
      };

      const handleDeleteElement = () => {
        if (selectedElementId) {
          const newElements = state.elements.filter((el) => el.id !== selectedElementId);
          saveHistory({ ...state, elements: newElements });
          setSelectedElementId(null);
        }
      };

      const handleExport = async (format, size) => {
        try {
          const dataUrl = await exportCanvas(
            state.baseImage,
            state.elements,
            state.background,
            state.adjustments,
            size,
            format
          );

          const link = document.createElement('a');
          link.download = `${state.projectName}.${format}`;
          link.href = dataUrl;
          link.click();
        } catch (error) {
          console.error('Export failed:', error);
          alert('Failed to export emoji. Please try again.');
        }
      };

      const selectedElement = state.elements.find((el) => el.id === selectedElementId);

      if (!state.baseImage) {
        return (
          <div className="h-screen flex flex-col">
            <TopBar
              projectName={state.projectName}
              onProjectNameChange={(name) => setState({ ...state, projectName: name })}
              onUndo={handleUndo}
              onRedo={handleRedo}
              onReset={handleReset}
              onExport={handleExport}
              canUndo={historyIndex > 0}
              canRedo={historyIndex < history.length - 1}
            />
            <UploadArea onImageUpload={handleImageUpload} />
          </div>
        );
      }

      return (
        <div className="h-screen flex flex-col">
          <TopBar
            projectName={state.projectName}
            onProjectNameChange={(name) => setState({ ...state, projectName: name })}
            onUndo={handleUndo}
            onRedo={handleRedo}
            onReset={handleReset}
            onExport={handleExport}
            canUndo={historyIndex > 0}
            canRedo={historyIndex < history.length - 1}
          />

          <div className="flex-1 flex overflow-hidden relative">
            {/* Desktop Left Sidebar */}
            <div className="hidden lg:block">
              <LeftSidebar
                onAddElement={handleAddElement}
                onBackgroundChange={(background) =>
                  saveHistory({ ...state, background })
                }
                adjustments={state.adjustments}
                onAdjustmentsChange={(adjustments) =>
                  setState({ ...state, adjustments })
                }
                background={state.background}
              />
            </div>

            {/* Mobile Left Panel Overlay */}
            {mobileLeftPanel && (
              <>
                <div 
                  className="fixed inset-0 bg-black/50 z-40 lg:hidden"
                  onClick={() => setMobileLeftPanel(false)}
                />
                <div className="fixed left-0 top-14 bottom-0 z-50 lg:hidden animate-slide-in-left">
                  <LeftSidebar
                    onAddElement={(element) => {
                      handleAddElement(element);
                      setMobileLeftPanel(false);
                    }}
                    onBackgroundChange={(background) => {
                      saveHistory({ ...state, background });
                    }}
                    adjustments={state.adjustments}
                    onAdjustmentsChange={(adjustments) =>
                      setState({ ...state, adjustments })
                    }
                    background={state.background}
                  />
                </div>
              </>
            )}

            <Canvas
              baseImage={state.baseImage}
              elements={state.elements}
              background={state.background}
              adjustments={state.adjustments}
              zoom={state.zoom}
              onZoomChange={(zoom) => setState({ ...state, zoom })}
              selectedElementId={selectedElementId}
              onSelectElement={(id) => {
                setSelectedElementId(id);
                if (id && window.innerWidth < 1024) {
                  setMobileRightPanel(true);
                }
              }}
              onUpdateElement={handleUpdateElementDirect}
              onDragEnd={() => {
                // Save current state to history after drag ends
                setHistory((prev) => [...prev.slice(0, historyIndex + 1), state]);
                setHistoryIndex((prev) => prev + 1);
              }}
            />

            {/* Desktop Right Panel */}
            <div className="hidden lg:block">
              <RightPanel
                selectedElement={selectedElement || null}
                onUpdateElement={(updates) => {
                  if (selectedElementId) {
                    handleUpdateElement(selectedElementId, updates);
                  }
                }}
                onDeleteElement={handleDeleteElement}
              />
            </div>

            {/* Mobile Right Panel Overlay */}
            {mobileRightPanel && selectedElement && (
              <>
                <div 
                  className="fixed inset-0 bg-black/50 z-40 lg:hidden"
                  onClick={() => setMobileRightPanel(false)}
                />
                <div className="fixed right-0 top-14 bottom-0 z-50 lg:hidden animate-slide-in-right">
                  <RightPanel
                    selectedElement={selectedElement}
                    onUpdateElement={(updates) => {
                      if (selectedElementId) {
                        handleUpdateElement(selectedElementId, updates);
                      }
                    }}
                    onDeleteElement={() => {
                      handleDeleteElement();
                      setMobileRightPanel(false);
                    }}
                  />
                </div>
              </>
            )}

            {/* Mobile Bottom Navigation */}
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-30 lg:hidden safe-area-bottom">
              <div className="grid grid-cols-3 gap-1 p-2">
                <button
                  onClick={() => {
                    setMobileLeftPanel(true);
                    setMobileRightPanel(false);
                  }}
                  className="flex flex-col items-center justify-center py-3 rounded-lg hover:bg-purple-50 transition-all"
                >
                  <Palette className="w-6 h-6 text-purple-600 mb-1" />
                  <span className="text-xs font-medium text-gray-700">Elements</span>
                </button>
                <button
                  onClick={() => setSelectedElementId(null)}
                  className="flex flex-col items-center justify-center py-3 rounded-lg hover:bg-purple-50 transition-all"
                >
                  <ImageIcon className="w-6 h-6 text-purple-600 mb-1" />
                  <span className="text-xs font-medium text-gray-700">Canvas</span>
                </button>
                <button
                  onClick={() => {
                    if (selectedElement) {
                      setMobileRightPanel(true);
                      setMobileLeftPanel(false);
                    }
                  }}
                  disabled={!selectedElement}
                  className="flex flex-col items-center justify-center py-3 rounded-lg hover:bg-purple-50 transition-all disabled:opacity-40"
                >
                  <Layers className="w-6 h-6 text-purple-600 mb-1" />
                  <span className="text-xs font-medium text-gray-700">Properties</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
